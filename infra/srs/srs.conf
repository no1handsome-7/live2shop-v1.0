listen              1935;
max_connections     1000;
daemon              off;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

vhost __defaultVhost__ {
    min_latency     on;

    http_hooks {
        enabled         on;
        on_publish      http://media-segmenter:8091/hooks/srs/publish;
        on_unpublish    http://media-segmenter:8091/hooks/srs/unpublish;
    }

    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      20;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }
}
