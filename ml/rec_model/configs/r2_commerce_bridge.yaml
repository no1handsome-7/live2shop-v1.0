model:
  init_checkpoint: checkpoints/rec-model/r1/final
  reinit_content_adapter: true
data:
  train_glob: data/processed/rec/commerce_bridge/*.npz
train:
  micro_batch: 128
  grad_accum: 1
  lr: 0.0002
  weight_decay: 0.0001
  max_steps: 3000
  retrieval_weight: 1.0
  rank_weight: 1.0
  output_dir: checkpoints/rec-model/r2
