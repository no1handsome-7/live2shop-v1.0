seed: 42
model:
  init_checkpoint: checkpoints/commerce-vlm/p0/final
data:
  train_jsonl: data/processed/commerce_vlm/p1_cpt.jsonl
  num_workers: 4
train:
  stage: cpt
  micro_batch: 1
  grad_accum: 24
  lr: 5.0e-05
  weight_decay: 0.01
  max_steps: 1200
  save_every: 700
  log_every: 20
  gradient_checkpointing: true
  contrastive_weight: 0.1
  output_dir: checkpoints/commerce-vlm/p1
