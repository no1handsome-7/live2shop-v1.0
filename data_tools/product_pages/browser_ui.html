<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品采集 · 人工浏览器</title>
<style>
body{font:15px system-ui,sans-serif;background:#f4f6fa;color:#1b2638;margin:18px auto;max-width:1300px;padding:0 16px}
h1{font-size:22px}button,input{font:inherit;padding:9px;margin:4px;border:1px solid #aab7c8;border-radius:6px}
button{cursor:pointer;background:white}button:disabled{opacity:.5;cursor:default}#go{background:#174fb4;color:white}
#screen{display:block;width:100%;height:auto;border:1px solid #b9c4d4;background:white;cursor:crosshair}
#status{padding:12px;background:#e4edff;border-radius:8px}#error{color:#a12d1d}#where{overflow-wrap:anywhere}
</style>
<h1>商品采集 · 人工浏览器</h1>
<p>下方是服务器浏览器的实时画面。可用手机淘宝扫码登录，或点击画面中的输入框后通过下方输入栏填写。
登录后点击“完成，继续”；程序会重新打开原商品页并检查。图片仅在内存中传输。</p>
<p id="status">连接中…</p><p id="where"></p><p id="error"></p>
<div>
<input id="text" type="password" autocomplete="off" placeholder="输入文字后发送到已选中的页面输入框" size="40">
<button id="send">发送文字</button>
<button data-key="Tab">Tab</button><button data-key="Enter">Enter</button><button data-key="Backspace">退格</button>
<button data-key="Control+A">全选</button><button data-key="Escape">Esc</button>
<button id="up">向上滚动</button><button id="down">向下滚动</button><button id="go" disabled>完成，继续</button>
</div>
<p>画面可点击；刷新页面可重新连接。打开视频链接后可在此查看新窗口，完成核实后再继续。</p>
<img id="screen" alt="正在获取浏览器画面">
<script>
const token=location.hash.slice(1), screen=document.querySelector('#screen'), err=document.querySelector('#error');
let objectURL, busy=false;
async function api(path, body){
  const res=await fetch(path,{method:body?'POST':'GET',cache:'no-store',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
  if(!res.ok) throw new Error(res.status===403?'访问凭据无效，请使用终端提供的完整界面地址。':'浏览器忙或已结束，请稍后重试。');
  return res;
}
async function act(body){try{await api('/action',body);err.textContent='';}catch(e){err.textContent=e.message;}}
async function refresh(){
  if(busy) return; busy=true;
  try{
    const state=await (await api('/state')).json();
    document.querySelector('#status').textContent=state.message;
    document.querySelector('#where').textContent='当前页面：'+state.page;
    document.querySelector('#go').disabled=!state.waiting;
    const blob=await (await api('/frame')).blob(), next=URL.createObjectURL(blob);
    screen.src=next;if(objectURL)URL.revokeObjectURL(objectURL);objectURL=next;err.textContent='';
  }catch(e){err.textContent=e.message;}finally{busy=false;}
}
screen.onclick=e=>{const r=screen.getBoundingClientRect();act({type:'click',x:(e.clientX-r.left)*screen.naturalWidth/r.width,y:(e.clientY-r.top)*screen.naturalHeight/r.height});};
document.querySelector('#send').onclick=()=>{const input=document.querySelector('#text');const value=input.value;input.value='';act({type:'text',text:value});};
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>act({type:'key',key:b.dataset.key}));
document.querySelector('#up').onclick=()=>act({type:'wheel',delta:-650});
document.querySelector('#down').onclick=()=>act({type:'wheel',delta:650});
document.querySelector('#go').onclick=()=>{document.querySelector('#go').disabled=true;act({type:'continue'});};
refresh();setInterval(refresh,1500);
</script></html>
