syntax = "proto3";

package live2shop.v1;

option go_package = "github.com/live2shop/live2shop/gen/go/live2shop/v1;live2shopv1";
option java_multiple_files = true;
option java_package = "com.live2shop.proto.v1";
option java_outer_classname = "CommonProto";

message EventMeta {
  // UUIDv7 string generated by the producer or edge gateway.
  string event_id = 1;

  // Application-level schema revision. Keep at 1 for the v1 package.
  uint32 schema_version = 2;

  // UTC Unix epoch milliseconds representing when the business event occurred.
  int64 event_time_ms = 3;

  // UTC Unix epoch milliseconds when the event entered the server-side pipeline.
  int64 ingest_time_ms = 4;

  // UUIDv7 correlation identifier propagated across services.
  string trace_id = 5;

  // Logical producer name, e.g. web-client, event-gateway, content-ai.
  string producer = 6;
}

message ModelRef {
  // Stable logical model name, e.g. commerce-vlm or rec-model.
  string name = 1;

  // Immutable registered model version, e.g. "12".
  string version = 2;

  // Optional deployment alias such as champion/challenger.
  string alias = 3;
}

message EmbeddingVector {
  // Must match values length.
  uint32 dim = 1;

  // Proto3 numeric repeated fields use packed encoding.
  repeated float values = 2;

  // Semantic-space version. Embeddings from different versions must not be
  // compared unless an explicit adapter/migration exists.
  string version = 3;
}


message DeadLetterEvent {
  EventMeta meta = 1;

  string source_topic = 2;
  int32 source_partition = 3;
  int64 source_offset = 4;

  bytes source_key = 5;
  bytes source_payload = 6;

  string consumer = 7;
  string error = 8;
}
